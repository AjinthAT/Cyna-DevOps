---
# Installe Node Exporter sur les machines Linux de l'infra Genève
# (cf. CDC section 10.5.1) afin qu'elles remontent dans le job Prometheus
# "linux-node-exporter-infra" (monitoring/prometheus/prometheus.yml).
#
# Prérequis : un accès SSH depuis la VM DevOps vers ces machines (clé ou mot
# de passe géré par ailleurs, non inclus ici) et l'inventaire à jour
# (ansible/inventory.ini, groupe [infra_linux]).
#
# Usage :
#   ansible-playbook -i ansible/inventory.ini ansible/playbooks/deploy-node-exporter.yml

- name: Déployer Node Exporter sur l'infrastructure Linux CYNA
  hosts: infra_linux
  become: true

  vars:
    node_exporter_version: "1.8.2"
    node_exporter_arch: "linux-amd64"
    node_exporter_user: "node_exporter"

  tasks:
    - name: Créer l'utilisateur système node_exporter
      user:
        name: "{{ node_exporter_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Vérifier si Node Exporter est déjà installé
      stat:
        path: /usr/local/bin/node_exporter
      register: node_exporter_bin

    - name: Télécharger et extraire Node Exporter
      unarchive:
        src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
        dest: /tmp
        remote_src: true
      when: not node_exporter_bin.stat.exists

    - name: Installer le binaire dans /usr/local/bin
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        mode: "0755"
        remote_src: true
        owner: root
        group: root
      when: not node_exporter_bin.stat.exists

    - name: Déployer le service systemd
      copy:
        dest: /etc/systemd/system/node_exporter.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          User={{ node_exporter_user }}
          ExecStart=/usr/local/bin/node_exporter --web.listen-address=:9100
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: Redémarrer node_exporter

    - name: Activer et démarrer node_exporter
      systemd:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true

    # -----------------------------------------------------------------
    # Test de validation post-déploiement : "enabled + started" côté
    # systemd ne garantit pas que le binaire répond réellement (crash au
    # démarrage, mauvais port, etc.) — on vérifie donc l'endpoint HTTP lui
    # même, en local sur la machine cible.
    # -----------------------------------------------------------------
    - name: "Test de validation — Node Exporter répond sur /metrics"
      uri:
        url: "http://localhost:9100/metrics"
        status_code: 200
      register: check_node_exporter
      retries: 5
      delay: 3
      until: check_node_exporter.status == 200

    - name: Résumé du test de validation
      debug:
        msg: "Node Exporter répond correctement sur {{ inventory_hostname }}:9100 : déploiement validé."

    - name: Rappel du port à ouvrir côté firewall Sophos
      debug:
        msg: >
          Node Exporter écoute sur le port 9100 de {{ inventory_hostname }}.
          Vérifier que la règle firewall inter-VLAN autorise bien le flux
          VLAN 50 (SOC-MONITORING, MONITOR-GE-01) -> ce port, cf. CDC
          section 11.2 (Exigences firewall).

  handlers:
    - name: Redémarrer node_exporter
      systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true
