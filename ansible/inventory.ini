[devops]
localhost ansible_connection=local

# Machines Linux de la maquette Genève à superviser (cf. CDC section 10.5.1,
# plan d'adressage, et monitoring/prometheus/prometheus.yml job
# "linux-node-exporter-infra"). IP à ajuster si le plan d'adressage change ;
# ansible_host doit rester joignable en SSH depuis la VM DevOps.
[infra_linux]
saas-ge-01     ansible_host=10.10.40.10
app-backend-01 ansible_host=10.10.45.10
wazuh-ge-01    ansible_host=10.10.50.10
backup-ge-01   ansible_host=10.10.60.10

[linux:children]
devops
infra_linux

# Machines Windows Server (AD, fichiers) : pas gérées par ce dépôt Ansible
# pour l'instant (nécessite WinRM configuré côté Windows + un playbook
# dédié, non fourni ici). windows_exporter doit être installé manuellement
# en attendant. Voir monitoring/prometheus/prometheus.yml, job
# "windows-exporter-infra", et monitoring/README.md.
[infra_windows]
ad-ge-01   ansible_host=10.10.30.10
ad-ge-02   ansible_host=10.10.30.11
file-ge-01 ansible_host=10.10.30.20

# Firewalls Sophos XGS (cf. CDC section 10.5.4, table accesSophos). Pilotés
# via leur API HTTPS (port 4444) depuis le poste qui exécute Ansible, pas en
# SSH : connection=local, ansible_host sert uniquement d'adresse pour les
# appels API faits par deploy-firewall-rules.yml.
[firewalls]
sophos-geneve ansible_host=10.10.10.1 ansible_connection=local
sophos-paris  ansible_host=10.20.10.1 ansible_connection=local

[all:vars]
ansible_python_interpreter=/usr/bin/python3
