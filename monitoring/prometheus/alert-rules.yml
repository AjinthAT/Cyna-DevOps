groups:
  - name: cyna-alerts
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance indisponible"
          description: "La cible {{ $labels.instance }} ne répond plus."

      - alert: HighCpuLoad
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Charge CPU élevée"
          description: "CPU supérieur à 80% sur {{ $labels.instance }}."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Espace disque faible"
          description: "Moins de 15% d’espace disque disponible sur {{ $labels.instance }}."

      - alert: ServiceHttpDown
        expr: probe_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service HTTP(S) indisponible"
          description: "Le contrôle blackbox échoue pour {{ $labels.instance }} ({{ $labels.job }})."

      - alert: ServiceSlowResponse
        expr: probe_duration_seconds > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Temps de réponse HTTP(S) dégradé"
          description: "{{ $labels.instance }} met plus de 2s à répondre depuis 5 minutes."
