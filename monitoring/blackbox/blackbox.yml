modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      valid_status_codes: []
      method: GET
      preferred_ip_protocol: ip4

  # Pour les services HTTPS à certificat auto-signé de la maquette (ex. le
  # dashboard Wazuh, cf. CDC section 12.3). A ne pas réutiliser tel quel
  # pour un service exposé publiquement avec un vrai certificat.
  http_2xx_insecure:
    prober: http
    timeout: 5s
    http:
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      valid_status_codes: []
      method: GET
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true
